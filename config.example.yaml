watch:
  folder: "~/Videos/Incoming"
  extensions:
    - .mp4
    - .mkv
    - .avi
    - .mov
    - .webm
  delay_seconds: 10

processing:
  output_folder: "~/Videos/Processed"
  audio_format: "mp3"
  audio_bitrate: "192k"
  keep_audio: true

transcription:
  model_size: "base"
  device: "auto"
  compute_type: "int8"
  language: "ru"
  output_format: "txt"
  word_timestamps: true

telegram:
  bot_token: ""
  chat_id: ""

recorder:
  fps: 30
  # video_size: "1920x1080"  # only for Linux (x11grab)

process_watcher:
  program_names: []            # e.g. ["Zoom.exe", "obs64.exe"]
  poll_interval: 5

summarization:
  enabled: false
  provider: "gemini"
  api_key: ""
  model: "gemini-1.5-flash"   # can be changed to any Gemini model (e.g. gemini-1.5-pro, gemini-2.0-flash-exp)
  prompt: ""                  # custom prompt, can contain {text} placeholder for the transcript content

