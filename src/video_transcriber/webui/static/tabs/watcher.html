<section id="tab-watcher" x-data="watcherTab()" x-init="init()">
  <h2>Recorder</h2>

  <div class="card">
    <p>
      Status:
      <strong x-text="isRecording ? 'Recording…' : 'Idle'"></strong>
    </p>
    <p x-show="currentOutput" class="muted">
      Output: <code x-text="currentOutput"></code>
    </p>

    <div class="row">
      <button @click="start()" :disabled="isRecording || busy">▶ Start recording</button>
      <button @click="stop()"  :disabled="!isRecording || busy">⏹ Stop</button>
    </div>

    <p class="error" x-show="error" x-text="error"></p>
  </div>
</section>
