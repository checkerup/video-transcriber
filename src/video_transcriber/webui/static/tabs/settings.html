<section id="tab-settings" x-data="settingsTab()" x-init="init()">
  <h2>Settings — Audio capture</h2>

  <div class="card">
    <label>
      Audio mode
      <select x-model="form.audio_mode" :disabled="busy">
        <option value="none">No audio (video only)</option>
        <option value="mic">Microphone only</option>
        <option value="system">System sound only</option>
        <option value="both">Mic + System (default)</option>
      </select>
    </label>

    <label x-show="form.audio_mode === 'mic' || form.audio_mode === 'both'">
      Microphone
      <select x-model="form.mic_device" :disabled="busy">
        <option value="">(OS default)</option>
        <template x-for="d in devices.mic" :key="d">
          <option :value="d" x-text="d"></option>
        </template>
      </select>
    </label>

    <label x-show="form.audio_mode === 'system' || form.audio_mode === 'both'">
      System / loopback device
      <select x-model="form.system_device" :disabled="busy">
        <option value="">(OS default)</option>
        <template x-for="d in devices.system" :key="d">
          <option :value="d" x-text="d"></option>
        </template>
      </select>

      <p class="muted" x-show="devices.system.length === 0">
        No loopback device detected. On Windows enable
        <em>Sound → Recording → Stereo Mix</em>, then click Refresh.
      </p>
    </label>

    <div class="row">
      <button @click="refreshDevices()" :disabled="busy">↻ Refresh devices</button>
      <button @click="save()" :disabled="busy">💾 Save</button>
      <span class="muted" x-show="busy">working…</span>
      <span class="ok" x-show="savedOk">saved ✓</span>
      <span class="error" x-show="error" x-text="error"></span>
    </div>
  </div>
</section>
